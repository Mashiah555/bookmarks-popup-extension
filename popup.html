<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        /* ===========================
           GLOBAL VARIABLES & RESET
           =========================== */
        :root {
            --bg-color: #ffffff;
            --text-color: #333;
            --hover-color: #f0f0f0;
            --border-color: #ddd;
        }

        body.theme-dark {
            --bg-color: #202124;
            --text-color: #e8eaed;
            --hover-color: #3c4043;
            --border-color: #5f6368;
        }

        body {
            width: 320px;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* Common Utilities */
        .favicon {
            margin-right: 8px;
            vertical-align: middle;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        #search-box {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
        }

        /* ==================================================
           MODE 1: TREE VIEW (List Style)
           ================================================== */

        /* Only apply these rules if body has .view-tree */

        body.view-tree .folder-content {
            display: none;
            padding-inline-start: 15px;
            border-inline-start: 1px solid var(--border-color);
        }

        body.view-tree .folder-open+.folder-content {
            display: block;
        }

        /* List Item Styling */
        body.view-tree .folder-header,
        body.view-tree .bookmark-item {
            padding: 6px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-radius: 4px;
        }

        body.view-tree .folder-header:hover,
        body.view-tree .bookmark-item:hover {
            background-color: var(--hover-color);
        }

        body.view-tree .favicon {
            width: 16px;
            height: 16px;
        }


        /* ==================================================
           MODE 2: GRID VIEW (Icon Tiles)
           ================================================== */

        /* 1. LAYOUT: Apply 5-column grid to Root Container AND Sub-folders */
        body.view-grid #bookmarks-container,
        body.view-grid .folder-open+.folder-content {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            /* Force 5 cols */
            gap: 8px;
            padding: 4px 0;
            align-content: start;
        }

        /* 2. VISIBILITY: Folders hidden by default */
        body.view-grid .folder-content {
            display: none;
        }

        /* 3. FOLDER HEADERS: Must span full width */
        body.view-grid .node-wrapper {
            grid-column: 1 / -1;
            /* Spans all 5 columns */
            width: 100%;
        }

        /* 4. BOOKMARK TILES (Unified for Root and Folders) */
        body.view-grid .bookmark-item {
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: var(--bg-color);
            border: 1px solid transparent;
            border-radius: 6px;

            /* Ensure text is hidden and box is square */
            min-width: 0;
            transition: all 0.1s ease;
        }

        /* Hover Effect */
        body.view-grid .bookmark-item:hover {
            background-color: var(--hover-color);
            border-color: var(--border-color);
            transform: scale(1.1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        /* Large Icons */
        body.view-grid .favicon {
            width: 32px;
            height: 32px;
            margin: 0;
            object-fit: contain;
        }

        /* HIDE TEXT in grid mode */
        body.view-grid .bookmark-text {
            display: none;
        }

        /* Folder Header Styling (Bar) */
        body.view-grid .folder-header {
            padding: 8px;
            background: var(--hover-color);
            margin-top: 5px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <input type="text" id="search-box">
    <div id="bookmarks-container"></div>
    <script src="popup.js"></script>
</body>

</html>
