<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        /* VARIABLES (Default Light) */
        :root {
            --bg-color: #ffffff;
            --text-color: #333;
            --hover-color: #f0f0f0;
            --border-color: #ddd;
        }

        /* THEMES */
        body.theme-dark {
            --bg-color: #202124;
            --text-color: #e8eaed;
            --hover-color: #3c4043;
            --border-color: #5f6368;
        }

        body.theme-light {
            --bg-color: #ffffff;
            --text-color: #333;
            --hover-color: #f0f0f0;
        }

        body {
            width: 320px;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* RTL Support */
        html[dir="rtl"] body {
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #search-box {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
        }

        /* ===========================
       VIEW MODE: TREE (Default) 
       =========================== */
        .view-tree .folder-content {
            padding-inline-start: 15px;
            display: none;
            border-inline-start: 1px solid var(--border-color);
            /* Guide line */
        }

        .view-tree .folder-header,
        .view-tree .bookmark-item {
            padding: 6px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-radius: 4px;
            text-decoration: none;
            color: var(--text-color);
        }

        .view-tree .folder-header:hover,
        .view-tree .bookmark-item:hover {
            background-color: var(--hover-color);
        }

        .view-tree .arrow {
            margin-inline-end: 8px;
            display: inline-block;
            transition: 0.2s;
            font-size: 0.8em;
        }

        .view-tree .favicon {
            width: 16px;
            margin-inline-end: 8px;
        }

        /* ===========================
       VIEW MODE: GRID (Fixed Columns)
       =========================== */

        .view-grid .folder-content {
            display: none;
            /* FORCE 5 items per row. 
         (320px width / 5 = ~54px per card, perfect for 32px icons) */
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 8px 0;
            /* Vertical padding only */
        }

        .view-grid .node-wrapper .folder-open~.folder-content {
            display: grid;
        }

        /* Grid Items */
        .view-grid .bookmark-item {
            aspect-ratio: 1 / 1;
            /* Forces Perfect Square */
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: var(--bg-color);
            border: 1px solid transparent;
            border-radius: 6px;

            text-decoration: none;
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .view-grid .bookmark-item:hover {
            background-color: var(--hover-color);
            border-color: var(--border-color);
            transform: scale(1.05);
            /* Subtle pop */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Icons - Large and Centered */
        .view-grid .favicon {
            width: 32px;
            height: 32px;
            margin: 0;
            object-fit: contain;
        }

        /* HIDE text */
        .view-grid .bookmark-text {
            display: none;
        }

        /* Folder Headers (unchanged) */
        .view-grid .folder-header {
            padding: 8px;
            background: var(--hover-color);
            margin-top: 5px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <input type="text" id="search-box">
    <div id="bookmarks-container"></div>
    <script src="popup.js"></script>
</body>

</html>
